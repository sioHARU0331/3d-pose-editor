  if(bone!=='RightUpperArm'){
    status.textContent='送信失敗：今回はRightUpperArmのみです';
    return;
  }
  const values=[0,0,0];
  if(!reset)values[AI[axis]]=45;
  status.textContent='送信中';
  button.disabled=true;
  try{
    const response=await fetch('http://127.0.0.1:8766/fortune_pose_adjust',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(reset?{active:false,test_only:true,values:{}}:{active:true,test_only:true,values:{[bone]:values}})
    });
    if(!response.ok)throw new Error('HTTP '+response.status);
    V.RightUpperArm=[...values];
    test=null;
    sync();
    document.querySelector('#json').value=JSON.stringify({[bone]:values},null,2);
    state.textContent=reset?'RightUpperArm '+axis+'：初期値 0°':'RightUpperArm '+axis+'：+45° 適用中';
    state.className=reset?'reset':'active';
    status.textContent=state.textContent;
  }catch(error){
    status.textContent='送信失敗：'+error.message;
  }finally{
    button.disabled=false;
  }
}
const testState=document.createElement('div');
testState.id='testState';
testState.className='reset';
testState.textContent='RightUpperArm X：初期値 0°';
document.querySelector('details summary').after(testState);
document.querySelector('#plus').onclick=()=>sendVsfAxisTest(false);
document.querySelector('#zero').onclick=()=>sendVsfAxisTest(true);
function syncTestButton(){
  const axis=document.querySelector('#src').value;
  document.querySelector('#plus').textContent='RightUpperArm '+axis+' +45°を適用';
}
document.querySelector('#src').oninput=syncTestButton;
document.querySelector('#src').onchange=syncTestButton;
syncTestButton();
